name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: the ordinary CI must need no secrets, so PRs from forks run safely.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: format check
        run: pnpm format:check
      - name: test (with coverage thresholds)
        run: pnpm test:coverage
      - name: build
        run: pnpm build

      - name: schema drift (regenerate + verify clean)
        run: |
          pnpm schemas
          git diff --exit-code -- schemas \
            || (echo "::error::schemas/ is out of date — run 'pnpm schemas' and commit" && exit 1)

      - name: dashboard artifact validation (fixture → stage → verify → smoke)
        run: |
          pnpm exec tsx packages/deploy/src/cli.ts fixture --out "$RUNNER_TEMP"
          pnpm exec tsx packages/deploy/src/cli.ts stage --data "$RUNNER_TEMP" --dist apps/dashboard/dist
          pnpm exec tsx packages/deploy/src/cli.ts verify --dist apps/dashboard/dist
          pnpm exec tsx packages/deploy/src/cli.ts smoke --dist apps/dashboard/dist
