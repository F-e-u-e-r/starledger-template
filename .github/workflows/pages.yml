name: Pages

on:
  workflow_dispatch:
  # Deploys are driven entirely by pushes to main that change the app or the
  # dataset — including the daily sync's dataset commit (pushed with a
  # workflow-triggering App token; see sync-stars.yml's OPS-A invariant). The
  # old `workflow_call` entry point had no caller and was removed (B6).
  push:
    branches: [main]
    paths:
      - 'stars.json'
      - 'dataset-meta.json'
      - 'ai-annotations.json'
      - 'ai-annotations-meta.json'
      - 'discovery-candidates.json'
      - 'discovery-candidates-meta.json'
      - 'skills-classification.json'
      - 'skills-classification-meta.json'
      - 'skills-classified.md'
      - 'apps/dashboard/**'
      - 'packages/**'
      - '.github/workflows/pages.yml'

# GitHub's documented custom Pages deployment requires these.
permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest Pages deployment proceeds when runs overlap.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # Skip (don't fail) when no dataset is committed yet: the first deploy happens
  # after sync-stars commits data, so a dataless app/dispatch run is a green no-op.
  guard:
    runs-on: ubuntu-24.04
    outputs:
      has-data: ${{ steps.check.outputs.has-data }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - id: check
        run: |
          if [ -f stars.json ] && [ -f dataset-meta.json ]; then
            echo "has-data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-data=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No canonical dataset committed yet — skipping the Pages build/deploy. Run sync-stars (or commit stars.json + dataset-meta.json) first."
          fi

  build:
    needs: guard
    if: ${{ needs.guard.outputs.has-data == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Vite derives the Pages base path from GITHUB_REPOSITORY at build time.
      - name: build dashboard
        # VITE_PORTFOLIO_URL (optional repo variable `PORTFOLIO_URL`) turns on the
        # "← Portfolio" return link on the owner's deployment. It is deliberately NOT
        # hardcoded in source: the variable lives only in this repo's settings, so
        # starledger-template-derived repos build without it and never inherit the
        # maintainer's portfolio URL (WS4-SL-B / ADR-005).
        env:
          VITE_PORTFOLIO_URL: ${{ vars.PORTFOLIO_URL }}
        run: pnpm --filter @starred/dashboard build

      - name: stage + verify the canonical dataset into the artifact
        run: |
          pnpm exec tsx packages/deploy/src/cli.ts stage --data . --dist apps/dashboard/dist
          pnpm exec tsx packages/deploy/src/cli.ts verify --dist apps/dashboard/dist
          pnpm exec tsx packages/deploy/src/cli.ts smoke --dist apps/dashboard/dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
